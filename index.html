<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Adjustment — Sound Painting Solutions</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #f5f3ef;
    --surface: #ffffff;
    --border: #e2ddd6;
    --text: #1a1814;
    --muted: #8a847a;
    --accent: #2d5a3d;
    --accent-light: #eaf2ec;
    --accent-border: #c3dbc9;
    --error: #c0392b;
    --error-light: #fdf0ef;
    --hours-color: #1a5276;
    --hours-light: #eaf0f6;
    --hours-border: #aed6f1;
    --materials-color: #7d6608;
    --materials-light: #fefde7;
    --materials-border: #f9e79f;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 80px;
  }

  header {
    width: 100%;
    max-width: 800px;
    margin-bottom: 40px;
  }

  .wordmark {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
  }

  h1 {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  h1 span { font-weight: 600; }

  .badges {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-radius: 6px;
    padding: 10px 16px;
    font-family: var(--mono);
    font-size: 13px;
  }

  .badge.dollars {
    background: var(--accent-light);
    border: 1px solid var(--accent-border);
    color: var(--accent);
  }

  .badge.hours {
    background: var(--hours-light);
    border: 1px solid var(--hours-border);
    color: var(--hours-color);
  }

  .badge .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.7;
  }

  .badge .amount {
    font-size: 18px;
    font-weight: 500;
  }

  .card {
    width: 100%;
    max-width: 800px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .table-header {
    display: grid;
    grid-template-columns: 1fr 130px 100px 130px;
    gap: 12px;
    padding: 14px 24px;
    border-bottom: 2px solid var(--border);
    background: #faf9f7;
  }

  .table-header span {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .table-header span.col-hours { color: var(--hours-color); }
  .table-header span.col-materials { color: var(--materials-color); }
  .table-header span.col-scope { color: var(--accent); }

  .job-list { padding: 4px 0; }

  .job-row {
    display: grid;
    grid-template-columns: 1fr 130px 100px 130px;
    gap: 12px;
    align-items: center;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .job-row:last-child { border-bottom: none; }
  .job-row:hover { background: #faf9f7; }

  .job-info { min-width: 0; }

  .job-name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .job-number {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .input-wrap { position: relative; }

  .input-wrap.has-prefix::before {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
  }

  .input-wrap.dollars-prefix::before { content: '$'; }

  .field-input {
    font-family: var(--mono);
    font-size: 13px;
    width: 100%;
    padding: 8px 8px 8px 22px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    text-align: right;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    -moz-appearance: textfield;
  }

  .field-input.hours-field { padding: 8px; text-align: right; }

  .field-input::-webkit-outer-spin-button,
  .field-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .field-input:focus { background: var(--surface); }
  .field-input.scope-field:focus { border-color: var(--accent); }
  .field-input.hours-field:focus { border-color: var(--hours-color); }
  .field-input.materials-field:focus { border-color: var(--materials-color); }

  .field-input.scope-field.has-value { border-color: var(--accent-border); background: var(--accent-light); }
  .field-input.hours-field.has-value { border-color: var(--hours-border); background: var(--hours-light); }
  .field-input.materials-field.has-value { border-color: var(--materials-border); background: var(--materials-light); }
  .field-input.error-field { border-color: var(--error) !important; background: var(--error-light) !important; }

  .summary-section {
    width: 100%;
    max-width: 800px;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .summary-bar {
    padding: 14px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .summary-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .summary-numbers {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-family: var(--mono);
  }

  .running-val { font-size: 20px; font-weight: 500; transition: color 0.2s; }
  .running-val.match { color: var(--accent); }
  .running-val.over { color: var(--error); }
  .running-val.under { color: var(--text); }
  .running-val.hours-match { color: var(--hours-color); }

  .divider { color: var(--muted); font-size: 14px; }
  .target-val { font-size: 14px; color: var(--muted); }

  .progress-track {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease, background 0.2s;
    max-width: 100%;
  }

  .progress-fill.dollars-fill { background: var(--accent); }
  .progress-fill.hours-fill { background: var(--hours-color); }
  .progress-fill.over { background: var(--error); }

  .validation-msgs {
    width: 100%;
    max-width: 800px;
    margin-top: 4px;
    min-height: 36px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .validation-msg { font-size: 12px; font-family: var(--mono); transition: color 0.2s; }
  .validation-msg.error { color: var(--error); }
  .validation-msg.success { color: var(--accent); }
  .validation-msg.info { color: var(--muted); }

  .submit-btn {
    width: 100%;
    max-width: 800px;
    margin-top: 20px;
    padding: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  .submit-btn:hover:not(:disabled) { opacity: 0.88; }
  .submit-btn:active:not(:disabled) { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .success-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 16px;
    padding: 60px 24px;
  }

  .success-icon {
    width: 56px; height: 56px;
    background: var(--accent-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  .success-screen h2 { font-size: 22px; font-weight: 400; }
  .success-screen p { font-size: 14px; color: var(--muted); max-width: 340px; line-height: 1.6; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 80px 24px;
    color: var(--muted);
    font-size: 14px;
  }

  .loading-spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .error-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 16px;
    padding: 60px 24px;
  }

  #main-content {
    width: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
  }

  @media (max-width: 600px) {
    .table-header, .job-row { grid-template-columns: 1fr; gap: 8px; }
    .table-header span:first-child { display: none; }
    .job-row { padding: 16px; }
    .field-input { width: 100%; }
  }
</style>
</head>
<body>

<div id="loading-screen" class="loading-screen">
  <div class="loading-spinner"></div>
  <span>Loading adjustment data...</span>
</div>

<div id="error-screen" class="error-screen">
  <div style="font-size:32px;">⚠️</div>
  <h2 style="font-size:20px;font-weight:400;">Unable to load data</h2>
  <p id="error-msg" style="color:var(--muted);font-size:14px;max-width:320px;line-height:1.6;"></p>
</div>

<div id="main-content">
  <header>
    <div class="wordmark">Sound Painting Solutions</div>
    <h1>Split <span>scope adjustment</span><br>across jobs</h1>
    <div class="badges">
      <div class="badge dollars">
        <span class="label">$ to allocate</span>
        <span class="amount" id="total-display">$0</span>
      </div>
      <div class="badge hours" id="hours-badge" style="display:none;">
        <span class="label">hrs to allocate</span>
        <span class="amount" id="hours-display">0</span>
      </div>
    </div>
  </header>

  <div class="card">
    <div class="table-header">
      <span>Job</span>
      <span class="col-scope">Scope Adj $</span>
      <span class="col-hours">Hours</span>
      <span class="col-materials">Materials $</span>
    </div>
    <div class="job-list" id="job-list"></div>
  </div>

  <div class="summary-section">
    <div class="summary-bar">
      <span class="summary-label">Dollar total</span>
      <div class="summary-numbers">
        <span class="running-val under" id="running-dollars">$0</span>
        <span class="divider">/</span>
        <span class="target-val" id="target-dollars">$0</span>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill dollars-fill" id="progress-dollars" style="width:0%"></div>
    </div>

    <div class="summary-bar" id="hours-summary" style="display:none;">
      <span class="summary-label">Hours total</span>
      <div class="summary-numbers">
        <span class="running-val under" id="running-hours">0</span>
        <span class="divider">/</span>
        <span class="target-val" id="target-hours">0</span>
      </div>
    </div>
    <div class="progress-track" id="hours-progress-track" style="display:none;">
      <div class="progress-fill hours-fill" id="progress-hours" style="width:0%"></div>
    </div>
  </div>

  <div class="validation-msgs" id="validation-msgs"></div>
  <button class="submit-btn" id="submit-btn" disabled>Confirm split adjustment</button>
</div>

<div id="success-screen" class="success-screen">
  <div class="success-icon">✓</div>
  <h2>Adjustment confirmed</h2>
  <p id="success-msg"></p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const dealId = params.get('deal_id');
  const totalAdj = parseFloat(params.get('total')) || 0;
  let messageTs = params.get('ts') || '';
  let channelId = params.get('channel') || 'C01ARRB6R0U';

  const PROXY_URL = 'https://split-adjustment-proxy.webmaster-357.workers.dev';
  const SUBMIT_WEBHOOK = 'https://hooks.zapier.com/hooks/catch/599637/4om1y20/';

  const fmtDollars = (n) => '$' + parseFloat(n || 0).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
  const fmtHours = (n) => parseFloat(n || 0).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 1}) + ' hrs';
  const round2 = (n) => Math.round(n * 100) / 100;

  let jobs = [];
  let total = totalAdj;
  let totalHours = 0;

  async function loadJobs() {
    try {
      const res = await fetch(`${PROXY_URL}/?deal_id=${dealId}`);
      if (!res.ok) throw new Error('Proxy fetch failed');
      const data = await res.json();
      const payload = JSON.parse(data.value || '{}');
      jobs = payload.jobs || [];
      total = parseFloat(payload.total) || totalAdj;
      totalHours = parseFloat(payload.total_hours) || 0;

      // Get message_ts from Storage payload (overrides URL param if present)
      if (payload.message_ts) {
        messageTs = payload.message_ts;
      }
      if (payload.channel_id) {
        channelId = payload.channel_id;
      }

      renderPage();
    } catch (e) {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('error-screen').style.display = 'flex';
      document.getElementById('error-msg').textContent =
        'Could not load job data. Please close this page and use the Slack dropdown instead. (' + e.message + ')';
    }
  }

  function renderPage() {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'flex';

    document.getElementById('total-display').textContent = fmtDollars(total);
    document.getElementById('target-dollars').textContent = fmtDollars(total);

    if (totalHours !== 0) {
      document.getElementById('hours-badge').style.display = 'inline-flex';
      document.getElementById('hours-display').textContent = fmtHours(totalHours);
      document.getElementById('hours-summary').style.display = 'flex';
      document.getElementById('hours-progress-track').style.display = 'block';
      document.getElementById('target-hours').textContent = fmtHours(totalHours);
    }

    const list = document.getElementById('job-list');
    list.innerHTML = '';

    jobs.forEach((job, i) => {
      let value = {};
      try { value = JSON.parse(job.value || '{}'); } catch(e) {}
      const name = job.text?.text || value.job_number || 'Job ' + (i + 1);
      const num = value.job_number || '';
      const rowId = value.row_id || '';

      const row = document.createElement('div');
      row.className = 'job-row';
      row.innerHTML = `
        <div class="job-info">
          <div class="job-name">${name}</div>
          ${num ? `<div class="job-number">#${num}</div>` : ''}
        </div>
        <div class="input-wrap has-prefix dollars-prefix">
          <input class="field-input scope-field" type="number" step="0.01" min="0" placeholder="0"
            data-row-id="${rowId}" data-job-number="${num}" data-type="scope" data-index="${i}" />
        </div>
        <div class="input-wrap">
          <input class="field-input hours-field" type="number" step="0.5" min="0" placeholder="0"
            data-type="hours" data-index="${i}" ${totalHours === 0 ? 'disabled style="opacity:0.3;cursor:not-allowed;"' : ''} />
        </div>
        <div class="input-wrap has-prefix dollars-prefix">
          <input class="field-input materials-field" type="number" step="0.01" min="0" placeholder="0"
            data-type="materials" data-index="${i}" />
        </div>
      `;
      list.appendChild(row);
    });

    list.querySelectorAll('.field-input').forEach(input => {
      input.addEventListener('input', () => {
        updateFieldStyle(input);
        validate();
      });
    });

    validate();
  }

  function updateFieldStyle(input) {
    const v = parseFloat(input.value) || 0;
    if (v > 0) input.classList.add('has-value');
    else input.classList.remove('has-value');
    input.classList.remove('error-field');
  }

  function getValues() {
    const rows = document.querySelectorAll('.job-row');
    const result = [];
    rows.forEach((row) => {
      const scope = parseFloat(row.querySelector('.scope-field').value) || 0;
      const hours = parseFloat(row.querySelector('.hours-field').value) || 0;
      const materials = parseFloat(row.querySelector('.materials-field').value) || 0;
      const rowId = row.querySelector('.scope-field').dataset.rowId;
      const jobNumber = row.querySelector('.scope-field').dataset.jobNumber;
      result.push({
        scope, hours, materials, rowId, jobNumber,
        scopeEl: row.querySelector('.scope-field'),
        hoursEl: row.querySelector('.hours-field'),
        materialsEl: row.querySelector('.materials-field')
      });
    });
    return result;
  }

  function validate() {
    const rows = getValues();
    const msgs = [];
    let valid = true;

    rows.forEach(r => {
      r.scopeEl.classList.remove('error-field');
      r.hoursEl.classList.remove('error-field');
      r.materialsEl.classList.remove('error-field');
    });

    const totalScope = round2(rows.reduce((s, r) => s + r.scope, 0));
    const totalMaterials = round2(rows.reduce((s, r) => s + r.materials, 0));
    const totalDollars = round2(totalScope + totalMaterials);
    const dollarDiff = round2(totalDollars - total);

    const totalHrsEntered = Math.round(rows.reduce((s, r) => s + r.hours, 0) * 10) / 10;
    const hoursDiff = Math.round((totalHrsEntered - totalHours) * 10) / 10;

    const dollarPct = total > 0 ? Math.min((totalDollars / total) * 100, 100) : 0;
    document.getElementById('running-dollars').textContent = fmtDollars(totalDollars);
    document.getElementById('progress-dollars').style.width = dollarPct + '%';

    const dollarMatch = dollarDiff === 0;
    const dollarOver = dollarDiff > 0;
    document.getElementById('running-dollars').className = 'running-val ' + (dollarMatch ? 'match' : dollarOver ? 'over' : 'under');
    document.getElementById('progress-dollars').className = 'progress-fill dollars-fill' + (dollarOver ? ' over' : '');

    if (!dollarMatch) {
      valid = false;
      if (dollarOver) msgs.push({ text: `Over by ${fmtDollars(dollarDiff)} — reduce one or more amounts`, cls: 'error' });
      else msgs.push({ text: `${fmtDollars(Math.abs(dollarDiff))} remaining to allocate`, cls: 'info' });
    } else {
      msgs.push({ text: '✓ Dollar total matches', cls: 'success' });
    }

    if (totalHours !== 0) {
      const hoursPct = totalHours > 0 ? Math.min((totalHrsEntered / totalHours) * 100, 100) : 0;
      document.getElementById('running-hours').textContent = fmtHours(totalHrsEntered);
      document.getElementById('progress-hours').style.width = hoursPct + '%';

      const hoursMatch = hoursDiff === 0;
      const hoursOver = hoursDiff > 0;
      document.getElementById('running-hours').className = 'running-val ' + (hoursMatch ? 'hours-match' : hoursOver ? 'over' : 'under');
      document.getElementById('progress-hours').className = 'progress-fill hours-fill' + (hoursOver ? ' over' : '');

      if (!hoursMatch) {
        valid = false;
        if (hoursOver) msgs.push({ text: `Hours over by ${Math.abs(hoursDiff)} — reduce hours`, cls: 'error' });
        else msgs.push({ text: `${Math.abs(hoursDiff)} hrs remaining to allocate`, cls: 'info' });
      } else {
        msgs.push({ text: '✓ Hours total matches', cls: 'success' });
      }
    }

    rows.forEach(r => {
      if (r.hours > 0 && r.scope === 0) {
        r.hoursEl.classList.add('error-field');
        r.scopeEl.classList.add('error-field');
        msgs.push({ text: `Hours entered without scope adj $ on job #${r.jobNumber}`, cls: 'error' });
        valid = false;
      }
    });

    const container = document.getElementById('validation-msgs');
    container.innerHTML = '';
    msgs.forEach(m => {
      const el = document.createElement('div');
      el.className = 'validation-msg ' + m.cls;
      el.textContent = m.text;
      container.appendChild(el);
    });

    document.getElementById('submit-btn').disabled = !valid;
  }

  async function submitSplit() {
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Submitting...';

    const rows = getValues();
    const splits = rows.map(r => ({
      row_id: r.rowId,
      job_number: r.jobNumber,
      scope_adj: r.scope,
      hours: r.hours,
      materials: r.materials
    }));

    const payload = {
      deal_id: dealId,
      total: total,
      total_hours: totalHours,
      message_ts: messageTs,
      channel_id: channelId,
      splits: splits
    };

    try {
      await fetch(SUBMIT_WEBHOOK, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(payload)
      });

      document.getElementById('main-content').style.display = 'none';
      document.getElementById('success-screen').style.display = 'flex';
      const activeSplits = splits.filter(s => s.scope_adj > 0 || s.materials > 0);
      document.getElementById('success-msg').textContent =
        `The ${fmtDollars(total)} adjustment has been split across ${activeSplits.length} job${activeSplits.length !== 1 ? 's' : ''} and is being applied in Smartsheet.`;

    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Confirm split adjustment';
      const container = document.getElementById('validation-msgs');
      const el = document.createElement('div');
      el.className = 'validation-msg error';
      el.textContent = 'Submission failed — please try again.';
      container.appendChild(el);
    }
  }

  document.getElementById('submit-btn').addEventListener('click', submitSplit);

  if (!dealId) {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display = 'flex';
    document.getElementById('error-msg').textContent = 'No deal ID found in URL. Please access this page from the Slack message.';
  } else {
    loadJobs();
  }
</script>
</body>
</html>
